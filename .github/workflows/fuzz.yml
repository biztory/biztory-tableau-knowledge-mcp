name: Fuzz

# Fuzzes the untrusted-input parsers (error bodies from the network, ids from the model) with atheris.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * 3"

permissions:
  contents: read

jobs:
  untrusted-input:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
      - run: uv run --locked --group fuzz python fuzz/fuzz_untrusted_input.py -max_total_time=60
