[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "biztory-tableau-knowledge-mcp"
dynamic = ["version"]
description = "Search, explore and enrich the Tableau Knowledge graph from any MCP client: semantic search, lineage, impact and semantic context."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Biztory" }, { name = "Tim Dries", email = "tim.dries@biztory.be" }]
keywords = [
    "mcp", "model-context-protocol", "tableau", "tableau-knowledge", "knowledge-graph",
    "semantic-layer", "data-lineage", "llm", "claude", "ai-agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database :: Front-Ends",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    # official MCP SDK (bundles FastMCP + pydantic). No other runtime deps: stdlib urllib for HTTP.
    # >=1.28.1: first release with no known advisories (GHSA-9h52-p55h-vw2f and later).
    # <2 because mcp 2.0.0 removed mcp.server.fastmcp, which crashes the server on import.
    "mcp>=1.28.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "hypothesis>=6"]


[project.scripts]
biztory-tableau-knowledge-mcp = "biztory_tableau_knowledge_mcp.server:main"

[project.urls]
Homepage = "https://github.com/biztory/biztory-tableau-knowledge-mcp"
Repository = "https://github.com/biztory/biztory-tableau-knowledge-mcp"
Documentation = "https://github.com/biztory/biztory-tableau-knowledge-mcp#readme"
Issues = "https://github.com/biztory/biztory-tableau-knowledge-mcp/issues"
Changelog = "https://github.com/biztory/biztory-tableau-knowledge-mcp/blob/main/CHANGELOG.md"
"Release Notes" = "https://github.com/biztory/biztory-tableau-knowledge-mcp/releases"

[tool.hatch.version]
path = "src/biztory_tableau_knowledge_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/biztory_tableau_knowledge_mcp"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# Long lines are intentional here: model-facing tool docstrings and error hints.
# `ruff format` keeps actual code layout tidy.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: opt-in test that hits a real Tableau site (needs TABLEAU_LIVE + credentials)",
]

[tool.coverage.run]
source = ["biztory_tableau_knowledge_mcp"]
omit = ["*/__main__.py"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

# The MCP SDK's optional sub-imports aren't always typed; don't fail the strict run on them.
[[tool.mypy.overrides]]
module = "mcp.*"
ignore_missing_imports = true
